<html lang="ko">
<head>
<meta charset="utf-8">

<title>한남 버튼</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 32px 18px;
  display: flex; align-items: center; justify-content: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #25243a;
  background: linear-gradient(135deg, #f7f4ff 0%, #edf5ff 55%, #fff7f0 100%);
}
main {
  width: min(100%, 620px); padding: 38px 26px;
  text-align: center; background: rgba(255,255,255,.82);
  border: 1px solid rgba(130,130,180,.18); border-radius: 24px;
  box-shadow: 0 18px 55px rgba(57, 54, 100, .10);
}
h1 { margin: 0; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.04em; }
.subtitle { margin: 12px 0 28px; color: #77758b; font-size: 15px; }
.buttons { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; }
.sound {
  min-width: 126px; font-size: 20px; font-weight: 650;
  padding: 15px 25px; border: 0; border-radius: 14px;
  background: #6558d9; color: #fff; cursor: pointer;
  box-shadow: 0 7px 16px rgba(101,88,217,.22);
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.sound:hover { background: #5145c4; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(101,88,217,.26); }
.sound:active { transform: translateY(0); }
.sound:focus-visible { outline: 3px solid #b7afff; outline-offset: 3px; }
@media (max-width: 420px) { main { padding: 30px 18px; } .sound { flex: 1 1 40%; } }
</style>
